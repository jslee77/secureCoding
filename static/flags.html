<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureDocs — 플래그 현황판</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🚩 플래그 현황판</h1>
    <div><a href="/" class="flags-back">← 앱으로</a></div>
  </header>
  <main>
    <div class="card">
      <h2>획득한 플래그를 입력하세요</h2>
      <p class="hint">각 취약점을 실제로 공략하면 얻는 값(코드·키·비밀 등)을 붙여넣고 확인을 누르세요.
        정답이면 자동으로 현황판에 기록됩니다. 새로고침해도 유지됩니다(브라우저 저장).</p>
      <input id="flag-input" placeholder="예: S-CLASS-7F3A">
      <button id="flag-submit">확인</button>
      <button id="flag-reset" class="btn-muted">초기화</button>
      <p id="flag-msg" class="msg flags-msg"></p>
    </div>

    <div class="card">
      <h2>진행률</h2>
      <div id="overall"></div>
      <div id="board"></div>
    </div>
  </main>

  <script src="/static/flags.js"></script>
</body>
</html>
